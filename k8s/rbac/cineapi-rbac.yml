apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: cineapi-role
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cineapi-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: cineapi-sa
  namespace: default
roleRef:
  kind: Role
  name: cineapi-role
  apiGroup: rbac.authorization.k8s.io
