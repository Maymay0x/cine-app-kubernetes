<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>CineBook - Administration</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">⬅ Retour à l'accueil</a>
            <span class="navbar-text text-white">Administration CineBook</span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="alert alert-info">
            <strong>Admin :</strong> Vous êtes connecté en tant qu'administrateur.
        </div>

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" id="films-tab" data-bs-toggle="tab" data-bs-target="#films">Films</button></li>
            <li class="nav-item"><button class="nav-link" id="seances-tab" data-bs-toggle="tab" data-bs-target="#seances">Séances</button></li>
            <li class="nav-item"><button class="nav-link" id="clients-tab" data-bs-toggle="tab" data-bs-target="#clients">Clients</button></li>
            <li class="nav-item"><button class="nav-link" id="tickets-tab" data-bs-toggle="tab" data-bs-target="#tickets">Tous les tickets</button></li>
        </ul>

        <div class="tab-content">
            <!-- Films -->
            <div class="tab-pane fade show active" id="films">
                <div class="card">
                    <div class="card-header">
                        <h5>Ajouter un film</h5>
                    </div>
                    <div class="card-body">
                        <form id="addFilmForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Titre</label>
                                    <input class="form-control" id="filmTitre" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Durée (minutes)</label>
                                    <input type="number" class="form-control" id="filmDuree" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Genre</label>
                                    <input class="form-control" id="filmGenre" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" id="filmDescription" rows="2"></textarea>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">URL Affiche</label>
                                    <input class="form-control" id="filmAffiche" placeholder="https://...">
                                </div>
                                <div class="col-12">
                                    <button class="btn btn-primary">Ajouter le film</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Séances -->
            <div class="tab-pane fade" id="seances">
                <div class="card">
                    <div class="card-header">
                        <h5>Ajouter une séance</h5>
                    </div>
                    <div class="card-body">
                        <form id="addSeanceForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Film</label>
                                    <select class="form-select" id="seanceFilm" required>
                                        <option value="">Choisir...</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Salle</label>
                                    <input type="number" class="form-control" id="seanceSalle" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Places totales</label>
                                    <input type="number" class="form-control" id="seancePlaces" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Horaire</label>
                                    <input type="datetime-local" class="form-control" id="seanceHoraire" required>
                                </div>
                                <div class="col-12">
                                    <button class="btn btn-primary">Ajouter la séance</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Clients -->
            <div class="tab-pane fade" id="clients">
                <div class="card">
                    <div class="card-header">
                        <h5>Liste des clients</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Email</th>
                                        <th>Admin</th>
                                    </tr>
                                </thead>
                                <tbody id="clientsList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tous les tickets -->
            <div class="tab-pane fade" id="tickets">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between">
                            <h5>Tous les tickets</h5>
                            <button class="btn btn-outline-secondary btn-sm" id="refreshTickets">Rafraîchir</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Film</th>
                                        <th>Client</th>
                                        <th>Places</th>
                                        <th>Date réservation</th>
                                        <th>Statut</th>
                                    </tr>
                                </thead>
                                <tbody id="allTicketsList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            loadFilmsSelect();
            loadClients();
            loadAllTickets();
            
            $('#addFilmForm').submit(function(e) {
                e.preventDefault();
                $.ajax({
                    url: 'api/films',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        titre: $('#filmTitre').val(),
                        duree: parseInt($('#filmDuree').val()),
                        genre: $('#filmGenre').val(),
                        description: $('#filmDescription').val(),
                        affiche_url: $('#filmAffiche').val()
                    }),
                    success: (res) => {
                        alert(res.message);
                        $('#addFilmForm')[0].reset();
                        loadFilmsSelect();
                    },
                    error: (xhr) => {
                        if (xhr.status === 403) alert('Accès refusé');
                        else alert('Erreur ajout film');
                    }
                });
            });
            
            $('#addSeanceForm').submit(function(e) {
                e.preventDefault();
                $.ajax({
                    url: 'api/seances',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        film_id: parseInt($('#seanceFilm').val()),
                        salle_num: parseInt($('#seanceSalle').val()),
                        places_total: parseInt($('#seancePlaces').val()),
                        horaire: $('#seanceHoraire').val()
                    }),
                    success: (res) => {
                        alert(res.message);
                        $('#addSeanceForm')[0].reset();
                    },
                    error: (xhr) => {
                        if (xhr.status === 403) alert('Accès refusé');
                        else alert('Erreur ajout séance');
                    }
                });
            });
            
            $('#refreshTickets').click(() => loadAllTickets());
            
            function loadFilmsSelect() {
                $.ajax({
                    url: 'api/films',
                    type: 'GET',
                    success: (films) => {
                        let options = '<option value="">Choisir...</option>';
                        films.forEach(f => {
                            options += `<option value="${f.id}">${escapeHtml(f.titre)}</option>`;
                        });
                        $('#seanceFilm').html(options);
                    }
                });
            }
            
            function loadClients() {
                $.ajax({
                    url: 'api/clients',
                    type: 'GET',
                    success: (clients) => {
                        let html = '';
                        clients.forEach(c => {
                            html += `<tr><td>${c.id}</td><td>${escapeHtml(c.email)}</td><td>${c.is_admin ? '✅' : ''}</td></tr>`;
                        });
                        $('#clientsList').html(html);
                    },
                    error: (xhr) => {
                        if (xhr.status === 403) alert('Accès refusé - Admin uniquement');
                    }
                });
            }
            
            function loadAllTickets() {
                $.ajax({
                    url: 'api/tickets',
                    type: 'GET',
                    success: (tickets) => {
                        let html = '';
                        if (tickets.length === 0) {
                            html = '<tr><td colspan="6" class="text-center text-muted">Aucun ticket</td></tr>';
                        } else {
                            tickets.forEach(t => {
                                const date = new Date(t.date_reservation);
                                const dateStr = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
                                html += `
                                <tr>
                                    <td>${t.id}</td>
                                    <td>${escapeHtml(t.film_titre)}</td>
                                    <td>${escapeHtml(t.client_email)} (ID:${t.client_id})</td>
                                    <td>${t.nb_places}</td>
                                    <td>${dateStr}</td>
                                    <td><span class="badge ${t.statut === 'CONFIRME' ? 'bg-success' : 'bg-secondary'}">${t.statut}</span></td>
                                </tr>`;
                            });
                        }
                        $('#allTicketsList').html(html);
                    }
                });
            }
            
            function escapeHtml(str) {
                return String(str || '').replace(/[&<>"']/g, function(m) {
                    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'})[m];
                });
            }
        });
    </script>
</body>
</html>
